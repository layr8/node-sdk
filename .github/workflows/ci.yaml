name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Our own fleet, EXCEPT for pull requests from forks.
#
# This repository is public, so a fork PR is code from someone outside the org.
# Running that on the self-hosted fleet would hand its author a shell inside our
# cluster — the one case GitHub says not to use self-hosted runners for. Fork PRs
# stay on hosted runners, where a compromised job costs nothing.
#
# `github.event.pull_request` is null for a `push`, so pushes to main take the
# self-hosted branch of the expression.
jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'layr8-eks-runners' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  compat:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'layr8-eks-runners' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compat tests
        run: npm run compat:test
