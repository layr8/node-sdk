name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GitHub-hosted runners, not the self-hosted `layr8-eks-runners` fleet.
#
# This repository is public. GitHub's org-level setting "Allow public
# repositories to use self-hosted runners" is off by default, and it is off
# for this org — so self-hosted jobs on a public repo never get an eligible
# runner. We switched this workflow to `layr8-eks-runners` in PR #44 during a
# GitHub Actions hosted-runner outage; once it landed, `test` and `compat`
# queued for 20+ minutes with no runner picking them up (verified on PR #43),
# while the same fleet ran normally on private repos (e.g. layr8/agents PR
# #225 finished both legs in ~1.5 minutes). That confirms it's the public
# visibility, not the fleet itself. Reverting to hosted runners here; the
# fork-vs-non-fork guard this used to need is gone along with it, since
# hosted runners are safe for fork PRs by design.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compat tests
        run: npm run compat:test
