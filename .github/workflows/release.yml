name: Release

on:
  release:
    types: [published]
  # Manual re-drive for a release whose publish chain partially failed.
  # Every publishing step is idempotent, so re-running is always safe.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re-)publish, without the leading v (e.g. 0.2.0)"
        required: true

permissions:
  contents: read

jobs:
  # Resolves the version once, from either trigger, so the publish jobs can
  # check out the exact tag being released rather than whatever branch a
  # workflow_dispatch happened to run from.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=v$VERSION" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Tests run on the floor declared in package.json engines.
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  compat-test:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Compat tests
        run: npm run compat:test

  publish-npm:
    needs: [resolve, test, compat-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for a short-lived publish
      # credential. This is the only credential involved — there is no
      # NPM_TOKEN, so there is nothing to expire or rotate.
      id-token: write
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Validate tag matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${{ needs.resolve.outputs.version }}" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${{ needs.resolve.outputs.version }} != package.json $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Provenance is generated automatically under trusted publishing;
      # passing --provenance is redundant.
      - name: Publish to npm
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          if npm view "@layr8/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@layr8/sdk@$VERSION already on the registry — skipping publish."
            exit 0
          fi
          npm publish --access public

  publish-compat-image:
    needs: [resolve, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build compat JS
        run: npm run compat:build

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push compat image
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          IMAGE=ghcr.io/layr8/node-sdk/compat
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION already pushed — skipping build."
            exit 0
          fi
          docker build \
            --build-arg SDK_VERSION=$VERSION \
            -t $IMAGE:$VERSION \
            -f compat/Dockerfile compat/
          docker push $IMAGE:$VERSION

      # Folded in rather than given its own runner — it is one API call, and
      # re-triggering the gate is harmless.
      - name: Trigger compat-suite gate
        run: |
          gh api repos/layr8/compat-suite/dispatches \
            -f event_type=gate \
            -f "client_payload[sdk]=node" \
            -f "client_payload[version]=${{ needs.resolve.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.COMPAT_GATE_PAT }}
