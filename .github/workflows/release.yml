name: Release

on:
  release:
    types: [published]
  # Manual re-drive for a release whose publish chain partially failed.
  # Every publishing step is idempotent, so re-running is always safe.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re-)publish, without the leading v (e.g. 0.2.0)"
        required: true

# GitHub-hosted runners, not the self-hosted `layr8-eks-runners` fleet.
#
# This workflow was moved to the self-hosted fleet in PR #44 alongside
# ci.yaml, during a GitHub Actions hosted-runner outage. It needs to move
# back for the same reason ci.yaml did: this repository is public, and
# GitHub's org-level "Allow public repositories to use self-hosted runners"
# setting is off by default and off for this org, so self-hosted jobs on a
# public repo never get an eligible runner. Measured impact on this fleet:
# ci.yaml's jobs queued 20+ minutes with no runner picking them up on this
# public repo (PR #43), while the identical fleet served a private repo
# (layr8/agents PR #225) normally.
#
# Both triggers here (`release: published`, `workflow_dispatch`) require
# write access to this repository, so there is no fork path to guard against
# — that's not why this needs fixing. The org-level block is keyed on repo
# visibility plus self-hosted, not on how the workflow was triggered, so
# leaving `runs-on` pointed at the self-hosted fleet here would just queue
# indefinitely the same way, and this repo is about to cut v0.2.2.
permissions:
  contents: read

jobs:
  # Resolves the version once, from either trigger, so the publish jobs can
  # check out the exact tag being released rather than whatever branch a
  # workflow_dispatch happened to run from.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - id: v
        # INPUT_VERSION goes through the environment rather than being
        # interpolated into the script body, which would make the input
        # executable as shell.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=v$VERSION" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Tests run on the floor declared in package.json engines.
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  compat-test:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Compat tests
        run: npm run compat:test

  publish-npm:
    needs: [resolve, test, compat-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for a short-lived publish
      # credential. This is the only credential involved — there is no
      # NPM_TOKEN, so there is nothing to expire or rotate.
      id-token: write
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Node 24 already bundles a new enough npm; pinning to latest keeps the
      # requirement from drifting back under the floor on a runner image bump.
      - name: Upgrade npm to a version that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Validate tag matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${{ needs.resolve.outputs.version }}" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${{ needs.resolve.outputs.version }} != package.json $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The artifact, not the source tree. Doc comments compile into
      # `dist/*.d.ts`, so 0.2.2 and 0.2.3 shipped internal references that a
      # source scan would not have seen — and once on npm they could not be
      # taken back. This is the last point at which that is still preventable.
      - name: Check the packed artifact for internal references
        env:
          INTERNAL_NAMES: ${{ vars.INTERNAL_NAMES }}
        run: |
          TARBALL=$(npm pack --silent)
          ./scripts/check-public-hygiene.sh --tarball "$TARBALL"

      # Provenance is generated automatically under trusted publishing;
      # passing --provenance is redundant.
      - name: Publish to npm
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          if npm view "@layr8/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@layr8/sdk@$VERSION already on the registry — skipping publish."
            exit 0
          fi
          npm publish --access public

  publish-compat-image:
    needs: [resolve, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build compat JS
        run: npm run compat:build

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push compat image
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          IMAGE=ghcr.io/layr8/node-sdk/compat
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION already pushed — skipping build."
            exit 0
          fi
          docker build \
            --build-arg SDK_VERSION=$VERSION \
            -t $IMAGE:$VERSION \
            -f compat/Dockerfile compat/
          docker push $IMAGE:$VERSION

      # Folded in rather than given its own runner — it is one API call, and
      # re-triggering the gate is harmless.
      - name: Trigger the cross-language compatibility gate
        run: |
          GATE_REPO=layr8/compat-suite  # hygiene-ok: dispatch target, not a doc reference
          gh api "repos/$GATE_REPO/dispatches" \
            -f event_type=gate \
            -f "client_payload[sdk]=node" \
            -f "client_payload[version]=${{ needs.resolve.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.COMPAT_GATE_PAT }}
