name: Compat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  compat-test:
    name: Layer 1 Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run compat:test

  publish-compat-image:
    name: Publish Compat Image
    if: github.event_name == 'release'
    needs: compat-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run compat:build

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push compat image
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          TAG="${VERSION#v}"
          docker build \
            --build-arg SDK_VERSION="$TAG" \
            -t ghcr.io/layr8/node-sdk/compat:$TAG \
            -f compat/Dockerfile \
            compat/
          docker push ghcr.io/layr8/node-sdk/compat:$TAG

  compat-gate:
    name: Compat Gate
    if: github.event_name == 'release'
    needs: publish-compat-image
    runs-on: ubuntu-latest
    steps:
      - name: Trigger compat-suite gate
        env:
          GH_TOKEN: ${{ secrets.COMPAT_GATE_PAT }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          TAG="${VERSION#v}"
          gh api repos/layr8/compat-suite/dispatches \
            -f event_type=gate \
            -f "client_payload[sdk]=node" \
            -f "client_payload[version]=$TAG"